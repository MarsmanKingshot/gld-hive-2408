<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLD Hive #2408</title>
<style>
body{margin:0;background:#fff;color:#000;font-family:"Helvetica Neue",Arial,sans-serif;padding:8px 12px 24px}
.poster{max-width:1700px;margin:0 auto}
.poster svg{display:block;width:100%;height:auto}
p.hint{max-width:60ch;margin:12px auto 0;font-size:.9rem;color:#4a5a4a;text-align:center}
p.err{max-width:60ch;margin:40px auto;text-align:center;color:#8a2a1a}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="poster" id="poster"></div>
<p class="hint">Find your name, teleport to the X:Y in your cell. Pinch to zoom on a phone.</p>
<script>
// Draws the hive poster from sheet "3 Slots" of hive_workbook.xlsx in this folder.
// Upload a new workbook to the repository and the poster follows; nothing else to do.
const TRAPS = {1: [743, 462], 2: [743, 478]};
const RING = {1: "#0b3d45", 2: "#1f7a8a", 3: "#6ab4c1", 4: "#c2e1e6"};
const TITLE = "GoldenGuild bear hive: your new coordinates";
const only = Number(new URLSearchParams(location.search).get("trap")) || 0;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function draw(slots){
  // true positions: y runs to the right, x upward; U px per tile, a 2x2 seat is 2U square
  const U = 35, pad = 24, top = 100;
  const traps = only ? [only] : [1, 2];
  if (only) slots = slots.filter(s => s.trap === only);
  const xs = slots.map(s => s.x).concat(traps.map(n => TRAPS[n][0] - 1));
  const ys = slots.map(s => s.y).concat(traps.map(n => TRAPS[n][1] - 1));
  const X0 = Math.min(...xs), X1 = Math.max(...xs) + 2, Y0 = Math.min(...ys), Y1 = Math.max(...ys) + 2;
  const W = pad*2 + (Y1 - Y0)*U, H = pad*2 + top + (X1 - X0)*U;
  const px = y => pad + (y - Y0)*U, py = x => pad + top + (X1 - x)*U;  // top-left corner of a footprint at (x, y) with height h: py(x + h)
  const g = [];
  g.push(`<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`);
  g.push(`<text x="${W/2}" y="40" font-size="28" font-weight="700" fill="#000" text-anchor="middle">${esc(TITLE)}</text>`);
  g.push(`<text x="${W/2}" y="66" font-size="14" fill="#000" text-anchor="middle">Find your name, teleport to the X:Y in your cell.</text>`);
  let lx = W/2 - 4*70;
  for (const r of [1,2,3,4]) {
    g.push(`<rect x="${lx}" y="${top-8}" width="14" height="14" fill="${RING[r]}" stroke="#000" stroke-width=".8"/>`);
    g.push(`<text x="${lx+19}" y="${top+4}" font-size="12" fill="#000">ring ${r}</text>`);
    lx += 70;
  }
  g.push(`<rect x="${px(Y0)}" y="${py(X1)}" width="${(Y1-Y0)*U}" height="${(X1-X0)*U}" fill="#e4e6e3"/>`);
  for (const s of slots) {
    const x0 = px(s.y), y0 = py(s.x + 2), cx = x0 + U, cy = y0 + U;
    const fill = RING[s.ring] || "#1f7a8a", ink = s.ring <= 2 ? "#fff" : "#000";
    let name = s.player || ("#" + s.n); if (name.length > 10) name = name.slice(0,9) + "…";
    g.push(`<rect x="${x0}" y="${y0}" width="${2*U}" height="${2*U}" fill="${fill}" stroke="#000" stroke-width="1"/>`);
    g.push(`<text x="${cx}" y="${cy-3}" font-size="${name.length <= 7 ? 15 : 12}" font-weight="700" fill="${ink}" text-anchor="middle">${esc(name)}</text>`);
    g.push(`<text x="${cx}" y="${cy+15}" font-size="13" fill="${ink}" text-anchor="middle">${s.x}:${s.y}</text>`);
  }
  for (const nm of traps) {
    const t = TRAPS[nm], x0 = px(t[1]-1), y0 = py(t[0]+2), cx = x0 + 1.5*U, cy = y0 + 1.5*U;
    g.push(`<rect x="${x0}" y="${y0}" width="${3*U}" height="${3*U}" fill="#b5482e" stroke="#000" stroke-width="1"/>`);
    g.push(`<text x="${cx}" y="${cy-3}" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">BEAR TRAP ${nm}</text>`);
    g.push(`<text x="${cx}" y="${cy+15}" font-size="13" fill="#fff" text-anchor="middle">${t[0]}:${t[1]}</text>`);
  }
  document.getElementById("poster").innerHTML =
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" font-family="Helvetica Neue, Arial, sans-serif">${g.join("")}</svg>`;
}

fetch("hive_workbook.xlsx?" + Date.now()).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }).then(buf => {
  const wb = XLSX.read(buf, {type: "array"});
  const ws = wb.Sheets["3 Slots"];
  if (!ws) throw new Error("no sheet '3 Slots'");
  const rows = XLSX.utils.sheet_to_json(ws, {header: 1});
  const head = rows[0].map(h => String(h).trim().toLowerCase());
  const col = n => head.indexOf(n);
  const iSlot = col("slot"), iXY = col("x:y"), iTrap = col("trap"), iRing = col("ring"), iPlayer = col("player");
  const slots = rows.slice(1).filter(r => r[iXY]).map(r => {
    const [x, y] = String(r[iXY]).split(":").map(Number);
    return {n: Number(r[iSlot]), x, y, trap: Number(r[iTrap]), ring: Number(r[iRing]), player: r[iPlayer] ? String(r[iPlayer]).trim() : ""};
  });
  draw(slots);
}).catch(e => {
  document.getElementById("poster").innerHTML = `<p class="err">The poster could not be drawn: ${esc(e.message)}. Is hive_workbook.xlsx in the repository with a sheet named "3 Slots"?</p>`;
});
</script>
</body>
</html>
